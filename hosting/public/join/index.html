<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Join a D2D Advancer Team</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f4f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 430px);
      padding: 28px;
      border: 1px solid #d8dce3;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 14px 40px rgb(15 23 42 / 10%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #5b6472;
      font-size: 16px;
      line-height: 1.45;
    }

    .code {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid #d8dce3;
      border-radius: 10px;
      background: #f4f5f7;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    a {
      min-height: 50px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      color: #ffffff;
      background: #9a6b0d;
    }

    .secondary {
      color: #111827;
      border: 1px solid #c7ccd5;
      background: transparent;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #f8fafc;
        background: #08090b;
      }

      main {
        border-color: #303238;
        background: #17181c;
        box-shadow: none;
      }

      p {
        color: #a8adb8;
      }

      .code {
        border-color: #3a3c43;
        background: #23252a;
      }

      .secondary {
        color: #f8fafc;
        border-color: #4a4d55;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Join a D2D Advancer Team</h1>
    <p id="message">Open D2D Advancer to review and accept this team invitation.</p>
    <div id="code" class="code" hidden></div>
    <div class="actions">
      <a id="open-app" class="primary" href="https://apps.apple.com/app/id6751178741">Open D2D Advancer</a>
      <a class="secondary" href="https://apps.apple.com/app/id6751178741">Get D2D Advancer</a>
    </div>
  </main>
  <script>
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const inviteCode = (pathParts[1] || "").toUpperCase();
    const isValidInvite = /^[A-F0-9]{8}$/.test(inviteCode);
    const codeElement = document.getElementById("code");
    const messageElement = document.getElementById("message");
    const openAppLink = document.getElementById("open-app");

    if (pathParts[0] === "join" && isValidInvite) {
      codeElement.textContent = inviteCode;
      codeElement.hidden = false;
      openAppLink.href = `d2dadvancer://join/${inviteCode}`;
    } else {
      messageElement.textContent = "This invitation link is invalid. Ask the team owner for a new invite.";
      openAppLink.textContent = "Get D2D Advancer";
    }
  </script>
</body>
</html>
